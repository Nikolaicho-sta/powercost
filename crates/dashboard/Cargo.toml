[package]
name = "dashboard"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cost-engine = { version = "0.1.0", path = "../cost-engine" }
estimator = { version = "0.1.0", path = "../estimator" }
pc-core = { version = "0.1.0", path = "../pc-core" }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
storage = { version = "0.1.0", path = "../storage" }
tariff-engine = { version = "0.1.0", path = "../tariff-engine" }
thiserror = "2.0.21"

[dev-dependencies]
simulator = { path = "../simulator" }
