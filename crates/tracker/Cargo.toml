[package]
name = "tracker"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cost-engine = { version = "0.1.0", path = "../cost-engine" }
dashboard = { version = "0.1.0", path = "../dashboard" }
estimator = { version = "0.1.0", path = "../estimator" }
gap-classifier = { version = "0.1.0", path = "../gap-classifier" }
pc-core = { version = "0.1.0", path = "../pc-core" }
rust_decimal = "1.43.0"
sensors = { version = "0.1.0", path = "../sensors" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
state-detection = { version = "0.1.0", path = "../state-detection" }
storage = { version = "0.1.0", path = "../storage" }
tariff-engine = { version = "0.1.0", path = "../tariff-engine" }
thiserror = "2.0.21"
