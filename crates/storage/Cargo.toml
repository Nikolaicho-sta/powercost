[package]
name = "storage"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cost-engine = { version = "0.1.0", path = "../cost-engine" }
estimator = { version = "0.1.0", path = "../estimator" }
gap-classifier = { version = "0.1.0", path = "../gap-classifier" }
pc-core = { version = "0.1.0", path = "../pc-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tariff-engine = { version = "0.1.0", path = "../tariff-engine" }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
